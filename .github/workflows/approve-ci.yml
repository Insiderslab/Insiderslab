name: Approve CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholder only: unit tests mock the database; prisma generate needs a URL shape.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: heili-approve
    steps:
      - uses: actions/checkout@v4

      - name: No secrets or local junk in the tree
        working-directory: .
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)__pycache__/|\.pyc$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Tracked files that must never be committed:"; echo "$bad"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: heili-approve/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run --maxWorkers=4
