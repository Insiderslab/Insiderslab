# Approve by Heili — produzione (VPS Hostinger, accanto a DM by Heili)
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy (già presente sul VPS) inoltra approve.heili.cloud → localhost:3200.
# Le variabili vengono da .env (vedi .env.example); POSTGRES_PASSWORD deve
# coincidere con la password dentro DATABASE_URL.

x-app-env: &app-env
  env_file: .env
  environment:
    UPLOAD_DIR: /data/uploads

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: approve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d approve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: heili-approve:latest
    restart: unless-stopped
    <<: *app-env
    # Applies pending migrations (prisma/migrations) before starting.
    command: sh -c "npx prisma migrate deploy && npm run start"
    ports:
      # Only on localhost: Caddy is the public entry point.
      - "127.0.0.1:3200:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    build: .
    image: heili-approve:latest
    restart: unless-stopped
    <<: *app-env
    command: ["npm", "run", "worker"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      # Started after web, so the migrations have run.
      web:
        condition: service_healthy

  cron:
    build: .
    image: heili-approve:latest
    restart: unless-stopped
    env_file: .env
    command: ["sh", "scripts/cron.sh"]
    environment:
      CRON_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
