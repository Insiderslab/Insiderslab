# Approve by Heili — produzione (VPS Hostinger, accanto a DM by Heili)
#
# UNA sola istanza su approve.heili.cloud con APP_VARIANT=all: post social,
# articoli e creatività nella stessa app, organizzati PER CLIENTE (i "servizi"
# di ogni cliente si scelgono nella sua scheda). Avvio:
#
#   docker compose -f docker-compose.prod.yml up -d --build      # → 127.0.0.1:3200
#
# Le variabili sotto hanno già il valore giusto per questa istanza, quindi il
# file d'ambiente (.env) deve contenere solo le variabili dell'app
# (NEXTAUTH_URL, segreti, DATABASE_URL…). POSTGRES_PASSWORD deve coincidere
# con la password dentro DATABASE_URL.
#
# Avanzato (facoltativo): lo stesso file può avviare istanze separate con una
# sola variante (es. un'istanza solo blog su un altro dominio). Ogni istanza
# è uno stack Compose a sé, con il suo file d'ambiente passato con
# --env-file, che imposta:
#   COMPOSE_PROJECT_NAME  nome dello stack (default heili-approve); i volumi
#                         prendono questo prefisso, gli stack non condividono dati
#   APP_VARIANT           all (default) | social | blog | ads
#   APP_PORT              porta su 127.0.0.1 per Caddy (default 3200)
#   ENV_FILE              lo stesso file, passato anche ai container (default .env)
# Vedi README, "Servizi per cliente" → "Istanze separate per tipo".

name: ${COMPOSE_PROJECT_NAME:-heili-approve}

x-app-env: &app-env
  env_file: ${ENV_FILE:-.env}
  environment:
    UPLOAD_DIR: /data/uploads
    APP_VARIANT: ${APP_VARIANT:-all}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: approve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD nel file d'ambiente}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d approve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Same image for every variant: APP_VARIANT is read at runtime.
    image: heili-approve:latest
    restart: unless-stopped
    <<: *app-env
    # Applies pending migrations (prisma/migrations) before starting.
    command: sh -c "npx prisma migrate deploy && npm run start"
    ports:
      # Only on localhost: Caddy is the public entry point.
      - "127.0.0.1:${APP_PORT:-3200}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    build: .
    image: heili-approve:latest
    restart: unless-stopped
    <<: *app-env
    # Sends approved social posts to Metricool (blog and ads never queue jobs;
    # a blog- or ads-only instance just reports its heartbeat for /api/health).
    command: ["npm", "run", "worker"]
    volumes:
      - uploads:/data/uploads
    # service_started, not service_healthy: /api/health includes the worker
    # heartbeat, so waiting for a healthy web would deadlock.
    depends_on:
      # Started after web, so the migrations have run.
      web:
        condition: service_started

  cron:
    build: .
    image: heili-approve:latest
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    command: ["sh", "scripts/cron.sh"]
    environment:
      # The web service of THIS stack (each project has its own network).
      CRON_BASE_URL: http://web:3000
      APP_VARIANT: ${APP_VARIANT:-all}
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  uploads:
