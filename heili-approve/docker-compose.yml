# Approve by Heili — servizi per lo sviluppo locale (Postgres + Redis)
#
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/approve
#   REDIS_URL=redis://localhost:6379
#
# L'app e il worker girano sulla macchina (npm run dev / npm run worker).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: approve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d approve"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
